user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =========================================================================
    # CẤU HÌNH ĐỊNH DẠNG LOG JSON CHO PROMTAIL & LOKI
    # =========================================================================
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log  /var/log/nginx/access.log  json_analytics;

    # =========================================================================
    # HARDENING BẢO MẬT NGINX
    # =========================================================================
    # 1. Ẩn thông tin phiên bản Nginx trong HTTP Header phản hồi
    server_tokens off;

    # 2. Phòng chống tấn công Buffer Overflow và giới hạn kích thước gói tin
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # 3. Timeout bảo vệ tài nguyên chống Slowloris DoS
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;

    # 4. Giới hạn tần suất request (Rate Limiting) chống Brute Force và DoS
    # Cho phép tối đa 15 requests/giây cho mỗi địa chỉ IP
    limit_req_zone $binary_remote_addr zone=billing_req_limit:10m rate=15r/s;
    limit_req_status 429;

    # Gzip nén dữ liệu truyền tải
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # =========================================================================
    # CỤM SERVER 1: CHUYỂN HƯỚNG HTTP (CỔNG 80) SANG HTTPS (CỔNG 443)
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Endpoint giám sát trạng thái cho Prometheus / Internal checks
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # Chuyển hướng 301 vĩnh viễn toàn bộ truy cập thường sang giao thức bảo mật HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # CỤM SERVER 2: NGINX REVERSE PROXY HTTPS (CỔNG 443)
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost;

        # Cấu hình chứng chỉ SSL tự ký
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Giao thức SSL/TLS an toàn (Vô hiệu hóa SSLv3, TLS 1.0, TLS 1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # =====================================================================
        # SECURITY HEADERS TOÀN DIỆN (ĐẠT CHUẨN ĐÁNH GIÁ BẢO MẬT)
        # =====================================================================
        # Bắt buộc trình duyệt luôn sử dụng HTTPS (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Ngăn chặn Clickjacking bằng cách không cho phép nhúng vào iframe ngoại trừ cùng domain
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Ngăn chặn MIME-type sniffing (thực thi file giả mạo đuôi ảnh/văn bản)
        add_header X-Content-Type-Options "nosniff" always;
        
        # Bật cơ chế chống XSS trên các trình duyệt cũ
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Kiểm soát thông tin đường dẫn giới thiệu khi chuyển trang
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Content Security Policy (CSP) kiểm soát các nguồn tài nguyên hợp lệ
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com;" always;
        
        # Khóa các tính năng phần cứng nhạy cảm của người dùng
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # =====================================================================
        # ĐIỀU HƯỚNG REVERSE PROXY ĐẾN ỨNG DỤNG BILLING APP
        # =====================================================================
        location / {
            # Áp dụng giới hạn tần suất request với hàng đợi burst = 20
	    # limit_req zone=billing_req_limit burst=20 nodelay;

            proxy_pass http://app:3000;
            
            # Cấu hình proxy headers đầy đủ
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            
            # Thời gian timeout kết nối tới upstream app
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Trang thông báo lỗi thân thiện và an toàn
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
