server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thập Log trực tiếp từ file app.log của Web App
  - job_name: billing-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: billing-app
          service: billing-app
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            status: status
            method: method
            url: url
      - labels:
          level:
          status:

  # 2. Thu thập Log từ Nginx Reverse Proxy (Access Log & Error Log)
  - job_name: nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: reverse-proxy
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            time_local: time_local
            remote_addr: remote_addr
            status: status
            request_uri: request_uri
            request_method: request_method
      - labels:
          status:
          request_method:

  # 3. Thu thập Log từ Docker Containers qua Docker Daemon
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_name']
        regex: '.*billing.*'
        action: keep
